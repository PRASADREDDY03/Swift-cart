<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Cart | Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-main);
        }
        .auth-card {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .auth-input:focus {
            border-color: var(--brand-primary);
        }
        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: var(--brand-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }
        .auth-btn:hover {
            opacity: 0.9;
        }
        .auth-link {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="brand-logo" style="display: block; margin-bottom: 2rem;">
                swift<span>cart</span>
            </a>
            <h2 style="margin-bottom: 1.5rem; color: var(--text-main);">Create an Account</h2>
            <form id="signup-form">
                <input type="text" id="signup-name" class="auth-input" placeholder="Full Name" required>
                <input type="email" class="auth-input" placeholder="Email Address" required>
                <input type="password" class="auth-input" placeholder="Password" required>
                <button type="submit" class="auth-btn">Sign Up</button>
            </form>
            
            <script>
                document.getElementById('signup-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('signup-name').value;
                    const username = name.split(' ')[0]; // Use first name
                    localStorage.setItem('velox_user', username);
                    window.location.href = 'index.html';
                });
            </script>
            <p style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
                Already have an account? <a href="login.html" class="auth-link">Login</a>
            </p>
        </div>
    </div>
</body>
</html>
